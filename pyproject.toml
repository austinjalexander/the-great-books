[project]
name = "the-great-books"
version = "0.1.0"
description = "Self-study repository replicating the Thomas Aquinas College Great Books curriculum."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Austin J. Alexander" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "astropy>=6.1",
    "music21>=9.3",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["great", "notes"]
python_files = ["test_*.py", "*_test.py"]
